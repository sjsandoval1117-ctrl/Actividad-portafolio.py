<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Información</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    color: #1e293b;
    padding: 20px;
}

/* Tabla */
table {
    width: 100%;
    border-collapse: collapse;
    background: #f5f5fa;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}

th {
    background: #fbb6ce;
    color: #1e293b;
    padding: 12px;
    font-style: italic;
}

td {
    padding: 12px;
    text-align: center;
}

tr:nth-child(even) {
    background: #fcd5e0;
}

tr:hover {
    background: #fbcfe8;
}

/* Botones */
.botones {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

button {
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s, box-shadow 0.2s;
    color: #1e293b;
}

#btn-guardar { background: #fbb6ce; }
#btn-eliminar { background: #fcd5e0; }
#btn-actualizar { background: #e0aaff; }

button:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 12px rgba(255,182,193,0.3);
}

/* Columnas */
#section2 {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
}

.columna {
    flex: 1 1 45%;
    padding: 20px;
    background: #f5f5fa;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s;
}

.columna:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(255,182,193,0.3);
}
</style>
</head>
<body>

<h2>Tabla de Datos</h2>
<table>
<thead>
<tr><th>Nombre</th><th>Edad</th></tr>
</thead>
<tbody>
<tr><td>Sara</td><td>18</td></tr>
</tbody>
<tfoot>
<tr><td colspan="2">Información básica</td></tr>
</tfoot>
</table>

<div class="botones">
<button id="btn-guardar">GUARDAR</button>
<button id="btn-eliminar">ELIMINAR</button>
<button id="btn-actualizar">ACTUALIZAR</button>
</div>

<section id="section2">
<div class="columna">Columna 1</div>
<div class="columna">Columna 2</div>
</section>

</body>
</html>
