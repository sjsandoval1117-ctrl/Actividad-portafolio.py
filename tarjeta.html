<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tarjeta</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    background: #f5f5fa; /* gris pastel */
    padding: 25px;
    border-radius: 20px;
    width: 280px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(255,182,193,0.3);
}

.card h2 {
    color: #fbb6ce; /* rosa pastel */
    font-style: italic;
    margin-bottom: 10px;
}

.card p {
    color: #1e293b;
    margin-bottom: 8px;
}
</style>
</head>
<body>

<div class="card">
<h2>Sara Sandoval</h2>
<p>Desarrolladora en progreso</p>
<p>Edad: 18</p>
</div>

</body>
</html>
